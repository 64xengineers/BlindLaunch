[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = false

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

# Monad testnet. See https://docs.monad.xyz/developer-essentials/testnets
# Chain id 10143. Pass `--chain 10143` when broadcasting.
